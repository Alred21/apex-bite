<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Bite — K1 Speed Toronto 3D Electric Kart Trainer</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="boot-loader" role="status" aria-live="polite">
        <div class="boot-loader-card">
          <div class="boot-loader-brand">APEX BITE <span class="boot-loader-venue">K1 SPEED TORONTO</span></div>
          <div class="boot-loader-text">LOADING CIRCUIT &amp; KART...</div>
          <div class="boot-loader-bar" aria-hidden="true"><div class="boot-loader-fill"></div></div>
        </div>
      </div>
      <canvas id="viewport"></canvas>
      <div id="hud-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
